<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1110" viewBox="0 0 1160 1110" role="img" aria-label="新八荣八耻：八条全文，左耻右荣，无痛点小字">
    <defs><pattern id="grain" width="11" height="13" patternUnits="userSpaceOnUse"><circle cx="3" cy="7" r=".6" fill="#85795a" opacity=".11"/></pattern></defs>
    <rect width="1160" height="1110" fill="#faf4e7"/><rect width="1160" height="1110" fill="url(#grain)"/>
    <rect x="28" y="28" width="1104" height="1054" rx="2" fill="none" stroke="#292929" stroke-width="2"/>
    <rect x="44" y="47" width="8" height="192" fill="#cf3b32"/>
    <g font-family="Microsoft YaHei, sans-serif" fill="#262626">
    <text x="76" y="91" font-size="23" letter-spacing="5">AGENT 上岗须知</text>
    <text x="70" y="190" font-size="89" font-weight="900" letter-spacing="-3">新八荣八耻</text>
    <text x="76" y="237" font-size="26">给 Agent 立点规矩。</text>
    </g><g transform="translate(843 32) rotate(7 100 100)" stroke="#262626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M105 18V0"/><circle cx="105" cy="-6" r="8" fill="#cf3b32"/>
      <rect x="32" y="22" width="146" height="102" rx="29" fill="#fff9e9"/>
      <rect x="49" y="49" width="113" height="44" rx="17" fill="#262626"/>
      <path d="M73 69l7 7 10-12m31 6 7 7 10-12" stroke="#fff9e9" fill="none"/>
      <path d="M74 126l-11 59m77-59 17 58M48 141l-30 29m143-30 34 25" fill="none"/>
      <rect x="40" y="132" width="128" height="100" rx="8" fill="#f6cf58"/>
      <path d="M58 155h66m-66 19h90m-90 19h49"/>
      <path d="M123 204l10 10 22-27" stroke="#cf3b32" fill="none"/>
      <path d="M64 232l-5 20h-23m106-20 5 20h24" fill="none"/>
    </g><path d="M72 286h1016" stroke="#262626" stroke-width="3"/>
    <g font-family="Microsoft YaHei, sans-serif">
    <text x="132" y="354" font-size="47" fill="#6d6b64" font-weight="900">八耻</text>
    <text x="658" y="354" font-size="47" fill="#cf3b32" font-weight="900">八荣</text>
    <path d="M599 320v672" stroke="#c4bcac" stroke-dasharray="4 8"/>
    <text x="76" y="422" font-size="20" fill="#8c8577">01</text><text x="132" y="422" font-size="33" fill="#68655f">以误认目标为耻，</text><path d="M616 409l8 8 16-20" stroke="#cf3b32" stroke-width="3" fill="none"/><text x="658" y="422" font-size="34" font-weight="800" fill="#262626">以明确成效为荣。</text><path d="M132 448h950" stroke="#ded6c7"/><text x="76" y="501" font-size="20" fill="#8c8577">02</text><text x="132" y="501" font-size="33" fill="#68655f">以无据断言为耻，</text><path d="M616 488l8 8 16-20" stroke="#cf3b32" stroke-width="3" fill="none"/><text x="658" y="501" font-size="34" font-weight="800" fill="#262626">以查证求实为荣。</text><path d="M132 527h950" stroke="#ded6c7"/><text x="76" y="580" font-size="20" fill="#8c8577">03</text><text x="132" y="580" font-size="33" fill="#68655f">以闭门造轮为耻，</text><path d="M616 567l8 8 16-20" stroke="#cf3b32" stroke-width="3" fill="none"/><text x="658" y="580" font-size="34" font-weight="800" fill="#262626">以择优复用为荣。</text><path d="M132 606h950" stroke="#ded6c7"/><text x="76" y="659" font-size="20" fill="#8c8577">04</text><text x="132" y="659" font-size="33" fill="#68655f">以照单全收为耻，</text><path d="M616 646l8 8 16-20" stroke="#cf3b32" stroke-width="3" fill="none"/><text x="658" y="659" font-size="34" font-weight="800" fill="#262626">以独立判断为荣。</text><path d="M132 685h950" stroke="#ded6c7"/><text x="76" y="738" font-size="20" fill="#8c8577">05</text><text x="132" y="738" font-size="33" fill="#68655f">以表面达标为耻，</text><path d="M616 725l8 8 16-20" stroke="#cf3b32" stroke-width="3" fill="none"/><text x="658" y="738" font-size="34" font-weight="800" fill="#262626">以实物验收为荣。</text><path d="M132 764h950" stroke="#ded6c7"/><text x="76" y="817" font-size="20" fill="#8c8577">06</text><text x="132" y="817" font-size="33" fill="#68655f">以无声中断为耻，</text><path d="M616 804l8 8 16-20" stroke="#cf3b32" stroke-width="3" fill="none"/><text x="658" y="817" font-size="34" font-weight="800" fill="#262626">以有据续作为荣。</text><path d="M132 843h950" stroke="#ded6c7"/><text x="76" y="896" font-size="20" fill="#8c8577">07</text><text x="132" y="896" font-size="33" fill="#68655f">以无效消耗为耻，</text><path d="M616 883l8 8 16-20" stroke="#cf3b32" stroke-width="3" fill="none"/><text x="658" y="896" font-size="34" font-weight="800" fill="#262626">以及时收敛为荣。</text><path d="M132 922h950" stroke="#ded6c7"/><text x="76" y="975" font-size="20" fill="#8c8577">08</text><text x="132" y="975" font-size="33" fill="#68655f">以黑箱推进为耻，</text><path d="M616 962l8 8 16-20" stroke="#cf3b32" stroke-width="3" fill="none"/><text x="658" y="975" font-size="34" font-weight="800" fill="#262626">以主动汇报为荣。</text><path d="M72 1031h1016" stroke="#262626" stroke-width="2"/>
    <text x="76" y="1065" font-size="19" fill="#746f63">八条工作约定 · 逐条解读见正文</text>
    <text x="1080" y="1065" text-anchor="end" font-size="17" fill="#746f63">CYH29HAO / .SKILL</text>
    </g></svg>