<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="950" viewBox="0 0 1480 950" role="img"><rect width="1480" height="950" fill="#f5f1e8"/><rect width="1480" height="211" fill="#1c2428"/><text x="69" y="104" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="78" font-weight="800" fill="#f5f1e8" >新八荣八耻</text><text x="488" y="104" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="54" font-weight="600" fill="#df5a36" >.skill</text><text x="73" y="164" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="29" font-weight="400" fill="#f5f1e8" >给你的 Agent 装上新八荣八耻</text><text x="1408" y="75" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="400" fill="#c1cac4" text-anchor="end">主动汇报 · 逐条验收 · 额度收尾</text><text x="1408" y="163" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="500" fill="#f5f1e8" text-anchor="end">模型在进化，工作作风也得跟上。</text><text x="72" y="296" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="700" fill="#df5a36" >01</text><text x="134" y="287" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="36" font-weight="500" fill="#66716e" >以误认目标为耻，</text><text x="134" y="330" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="36" font-weight="800" fill="#1c2428" >以明确成效为荣。</text><text x="134" y="373" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="28" font-weight="400" fill="#66716e" >做了很多，却偏离真正目标</text><line x1="72" y1="387" x2="707" y2="387" stroke="#d8d6cd"/><text x="792" y="296" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="700" fill="#df5a36" >02</text><text x="854" y="287" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="36" font-weight="500" fill="#66716e" >以无据断言为耻，</text><text x="854" y="330" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="36" font-weight="800" fill="#1c2428" >以查证求实为荣。</text><text x="854" y="373" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="28" font-weight="400" fill="#66716e" >说得很满，依据却没有查</text><line x1="792" y1="387" x2="1427" y2="387" stroke="#d8d6cd"/><text x="72" y="445" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="700" fill="#df5a36" >03</text><text x="134" y="436" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="36" font-weight="500" fill="#66716e" >以闭门造轮为耻，</text><text x="134" y="479" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="36" font-weight="800" fill="#1c2428" >以择优复用为荣。</text><text x="134" y="522" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="28" font-weight="400" fill="#66716e" >现成方案不用，从头再造一遍</text><line x1="72" y1="536" x2="707" y2="536" stroke="#d8d6cd"/><text x="792" y="445" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="700" fill="#df5a36" >04</text><text x="854" y="436" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="36" font-weight="500" fill="#66716e" >以照单全收为耻，</text><text x="854" y="479" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="36" font-weight="800" fill="#1c2428" >以独立判断为荣。</text><text x="854" y="522" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="28" font-weight="400" fill="#66716e" >你随口举例，它却照单全收</text><line x1="792" y1="536" x2="1427" y2="536" stroke="#d8d6cd"/><text x="72" y="594" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="700" fill="#df5a36" >05</text><text x="134" y="585" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="36" font-weight="500" fill="#66716e" >以表面达标为耻，</text><text x="134" y="628" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="36" font-weight="800" fill="#1c2428" >以实物验收为荣。</text><text x="134" y="671" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="28" font-weight="400" fill="#66716e" >文件导出了，成品却不好用</text><line x1="72" y1="685" x2="707" y2="685" stroke="#d8d6cd"/><text x="792" y="594" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="700" fill="#df5a36" >06</text><text x="854" y="585" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="36" font-weight="500" fill="#66716e" >以无声中断为耻，</text><text x="854" y="628" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="36" font-weight="800" fill="#1c2428" >以有据续作为荣。</text><text x="854" y="671" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="28" font-weight="400" fill="#66716e" >工作断在半路，下次重新讲起</text><line x1="792" y1="685" x2="1427" y2="685" stroke="#d8d6cd"/><text x="72" y="743" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="700" fill="#df5a36" >07</text><text x="134" y="734" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="36" font-weight="500" fill="#66716e" >以无效消耗为耻，</text><text x="134" y="777" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="36" font-weight="800" fill="#1c2428" >以及时收敛为荣。</text><text x="134" y="820" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="28" font-weight="400" fill="#66716e" >同一条错路，来回反复试</text><text x="792" y="743" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="700" fill="#df5a36" >08</text><text x="854" y="734" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="36" font-weight="500" fill="#66716e" >以黑箱推进为耻，</text><text x="854" y="777" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="36" font-weight="800" fill="#1c2428" >以主动汇报为荣。</text><text x="854" y="820" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="28" font-weight="400" fill="#66716e" >工具刷满屏，进展靠你追问</text><line x1="72" y1="873" x2="1408" y2="873" stroke="#c8cbc0"/><text x="73" y="917" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="400" fill="#66716e" >八条工作约定。给 Agent，也给每一次协作。</text><text x="1408" y="917" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="500" fill="#66716e" text-anchor="end" letter-spacing="1.5">BY CYH29HAO</text></svg>