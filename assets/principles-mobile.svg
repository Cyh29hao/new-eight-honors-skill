<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1380" viewBox="0 0 900 1380" role="img"><rect width="900" height="1380" fill="#f5f1e8"/><rect width="900" height="237" fill="#1c2428"/><text x="56" y="99" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="68" font-weight="800" fill="#f5f1e8" >新八荣八耻</text><text x="422" y="99" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="45" font-weight="600" fill="#df5a36" >.skill</text><text x="59" y="158" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="32" font-weight="400" fill="#f5f1e8" >给你的 Agent 装上新八荣八耻</text><text x="59" y="205" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="27" font-weight="400" fill="#c1cac4" >主动汇报 · 逐条验收 · 额度收尾</text><text x="54" y="311" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="27" font-weight="700" fill="#df5a36" >01</text><text x="126" y="311" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="42" font-weight="600" fill="#66716e" >以误认目标为耻，</text><text x="462" y="311" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="42" font-weight="800" fill="#1c2428" >以明确成效为荣。</text><text x="128" y="355" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="39" font-weight="400" fill="#66716e" >做了很多，却偏离真正目标</text><line x1="55" y1="381" x2="845" y2="381" stroke="#d8d6cd"/><text x="54" y="428" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="27" font-weight="700" fill="#df5a36" >02</text><text x="126" y="428" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="42" font-weight="600" fill="#66716e" >以无据断言为耻，</text><text x="462" y="428" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="42" font-weight="800" fill="#1c2428" >以查证求实为荣。</text><text x="128" y="472" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="39" font-weight="400" fill="#66716e" >说得很满，依据却没有查</text><line x1="55" y1="498" x2="845" y2="498" stroke="#d8d6cd"/><text x="54" y="545" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="27" font-weight="700" fill="#df5a36" >03</text><text x="126" y="545" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="42" font-weight="600" fill="#66716e" >以闭门造轮为耻，</text><text x="462" y="545" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="42" font-weight="800" fill="#1c2428" >以择优复用为荣。</text><text x="128" y="589" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="39" font-weight="400" fill="#66716e" >现成方案不用，从头再造一遍</text><line x1="55" y1="615" x2="845" y2="615" stroke="#d8d6cd"/><text x="54" y="662" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="27" font-weight="700" fill="#df5a36" >04</text><text x="126" y="662" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="42" font-weight="600" fill="#66716e" >以照单全收为耻，</text><text x="462" y="662" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="42" font-weight="800" fill="#1c2428" >以独立判断为荣。</text><text x="128" y="706" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="39" font-weight="400" fill="#66716e" >你随口举例，它却照单全收</text><line x1="55" y1="732" x2="845" y2="732" stroke="#d8d6cd"/><text x="54" y="779" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="27" font-weight="700" fill="#df5a36" >05</text><text x="126" y="779" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="42" font-weight="600" fill="#66716e" >以表面达标为耻，</text><text x="462" y="779" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="42" font-weight="800" fill="#1c2428" >以实物验收为荣。</text><text x="128" y="823" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="39" font-weight="400" fill="#66716e" >文件导出了，成品却不好用</text><line x1="55" y1="849" x2="845" y2="849" stroke="#d8d6cd"/><text x="54" y="896" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="27" font-weight="700" fill="#df5a36" >06</text><text x="126" y="896" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="42" font-weight="600" fill="#66716e" >以无声中断为耻，</text><text x="462" y="896" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="42" font-weight="800" fill="#1c2428" >以有据续作为荣。</text><text x="128" y="940" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="39" font-weight="400" fill="#66716e" >工作断在半路，下次重新讲起</text><line x1="55" y1="966" x2="845" y2="966" stroke="#d8d6cd"/><text x="54" y="1013" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="27" font-weight="700" fill="#df5a36" >07</text><text x="126" y="1013" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="42" font-weight="600" fill="#66716e" >以无效消耗为耻，</text><text x="462" y="1013" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="42" font-weight="800" fill="#1c2428" >以及时收敛为荣。</text><text x="128" y="1057" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="39" font-weight="400" fill="#66716e" >同一条错路，来回反复试</text><line x1="55" y1="1083" x2="845" y2="1083" stroke="#d8d6cd"/><text x="54" y="1130" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="27" font-weight="700" fill="#df5a36" >08</text><text x="126" y="1130" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="42" font-weight="600" fill="#66716e" >以黑箱推进为耻，</text><text x="462" y="1130" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="42" font-weight="800" fill="#1c2428" >以主动汇报为荣。</text><text x="128" y="1174" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="39" font-weight="400" fill="#66716e" >工具刷满屏，进展靠你追问</text><line x1="55" y1="1221" x2="845" y2="1221" stroke="#c8cbc0"/><text x="59" y="1285" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="32" font-weight="600" fill="#1c2428" >模型在进化，工作作风也得跟上。</text><text x="59" y="1341" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="400" fill="#66716e" >EIGHT HONORS  /  BY CYH29HAO</text></svg>