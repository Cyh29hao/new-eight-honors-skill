    </g><path d="M48 248h664" stroke="#262626" stroke-width="3"/><g font-family="Microsoft YaHei,sans-serif"><text x="49" y="309" font-size="24" fill="#8c8577">01</text><text x="108" y="309" font-size="42" fill="#68655f">以误认目标为耻，</text><path d="M114 352l10 10 18-24" stroke="#cf3b32" stroke-width="4" fill="none"/><text x="166" y="365" font-size="44" font-weight="800" fill="#262626">以明确成效为荣。</text><path d="M108 398h585" stroke="#ded6c7"/><text x="49" y="448" font-size="24" fill="#8c8577">02</text><text x="108" y="448" font-size="42" fill="#68655f">以无据断言为耻，</text><path d="M114 491l10 10 18-24" stroke="#cf3b32" stroke-width="4" fill="none"/><text x="166" y="504" font-size="44" font-weight="800" fill="#262626">以查证求实为荣。</text><path d="M108 537h585" stroke="#ded6c7"/><text x="49" y="587" font-size="24" fill="#8c8577">03</text><text x="108" y="587" font-size="42" fill="#68655f">以闭门造轮为耻，</text><path d="M114 630l10 10 18-24" stroke="#cf3b32" stroke-width="4" fill="none"/><text x="166" y="643" font-size="44" font-weight="800" fill="#262626">以择优复用为荣。</text><path d="M108 676h585" stroke="#ded6c7"/><text x="49" y="726" font-size="24" fill="#8c8577">04</text><text x="108" y="726" font-size="42" fill="#68655f">以照单全收为耻，</text><path d="M114 769l10 10 18-24" stroke="#cf3b32" stroke-width="4" fill="none"/><text x="166" y="782" font-size="44" font-weight="800" fill="#262626">以独立判断为荣。</text><path d="M108 815h585" stroke="#ded6c7"/><text x="49" y="865" font-size="24" fill="#8c8577">05</text><text x="108" y="865" font-size="42" fill="#68655f">以表面达标为耻，</text><path d="M114 908l10 10 18-24" stroke="#cf3b32" stroke-width="4" fill="none"/><text x="166" y="921" font-size="44" font-weight="800" fill="#262626">以实物验收为荣。</text><path d="M108 954h585" stroke="#ded6c7"/><text x="49" y="1004" font-size="24" fill="#8c8577">06</text><text x="108" y="1004" font-size="42" fill="#68655f">以无声中断为耻，</text><path d="M114 1047l10 10 18-24" stroke="#cf3b32" stroke-width="4" fill="none"/><text x="166" y="1060" font-size="44" font-weight="800" fill="#262626">以有据续作为荣。</text><path d="M108 1093h585" stroke="#ded6c7"/><text x="49" y="1143" font-size="24" fill="#8c8577">07</text><text x="108" y="1143" font-size="42" fill="#68655f">以无效消耗为耻，</text><path d="M114 1186l10 10 18-24" stroke="#cf3b32" stroke-width="4" fill="none"/><text x="166" y="1199" font-size="44" font-weight="800" fill="#262626">以及时收敛为荣。</text><path d="M108 1232h585" stroke="#ded6c7"/><text x="49" y="1282" font-size="24" fill="#8c8577">08</text><text x="108" y="1282" font-size="42" fill="#68655f">以黑箱推进为耻，</text><path d="M114 1325l10 10 18-24" stroke="#cf3b32" stroke-width="4" fill="none"/><text x="166" y="1338" font-size="44" font-weight="800" fill="#262626">以主动汇报为荣。</text><path d="M48 1405h664" stroke="#262626" stroke-width="2"/><text x="52" y="1452" font-size="23" fill="#746f63">八条工作约定 / CYH29HAO / .SKILL</text></g></svg>