<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440" role="img"><rect width="1080" height="1440" fill="#f4f0e6"/><rect x="0" y="0" width="14" height="1440" fill="#ef6b45"/><text x="65" y="91" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="55" font-weight="800" fill="#1c2428" >八荣八耻.skill</text><text x="67" y="147" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="30" font-weight="400" fill="#5d6668" >给 Agent 一套你愿意长期共事的工作规矩。</text><line x1="67" y1="194" x2="1013" y2="194" stroke="#cbc9c1"/><text x="65" y="269" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="42" font-weight="700" fill="#ef6b45" >01</text><text x="162" y="266" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="34" font-weight="700" fill="#1c2428" >以误认目标为耻，以明确成效为荣。</text><text x="162" y="306" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="400" fill="#626b6e" >认准目的与硬约束</text><text x="65" y="386" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="42" font-weight="700" fill="#ef6b45" >02</text><text x="162" y="383" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="34" font-weight="700" fill="#1c2428" >以无据断言为耻，以查证求实为荣。</text><text x="162" y="423" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="400" fill="#626b6e" >事实、推断、未知分清</text><text x="65" y="503" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="42" font-weight="700" fill="#ef6b45" >03</text><text x="162" y="500" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="34" font-weight="700" fill="#1c2428" >以闭门造轮为耻，以择优复用为荣。</text><text x="162" y="540" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="400" fill="#626b6e" >先找成熟方案，再决定怎么做</text><text x="65" y="620" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="42" font-weight="700" fill="#ef6b45" >04</text><text x="162" y="617" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="34" font-weight="700" fill="#1c2428" >以照单全收为耻，以独立判断为荣。</text><text x="162" y="657" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="400" fill="#626b6e" >授权之内，承担判断</text><text x="65" y="737" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="42" font-weight="700" fill="#ef6b45" >05</text><text x="162" y="734" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="34" font-weight="700" fill="#1c2428" >以表面达标为耻，以实物验收为荣。</text><text x="162" y="774" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="400" fill="#626b6e" >用真正的成果说明完成</text><text x="65" y="854" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="42" font-weight="700" fill="#ef6b45" >06</text><text x="162" y="851" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="34" font-weight="700" fill="#1c2428" >以无声中断为耻，以有据续作为荣。</text><text x="162" y="891" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="400" fill="#626b6e" >留下成果、缺口与下一步</text><text x="65" y="971" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="42" font-weight="700" fill="#ef6b45" >07</text><text x="162" y="968" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="34" font-weight="700" fill="#1c2428" >以无效消耗为耻，以及时收敛为荣。</text><text x="162" y="1008" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="400" fill="#626b6e" >换掉无效路线，做好就收工</text><text x="65" y="1088" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="42" font-weight="700" fill="#ef6b45" >08</text><text x="162" y="1085" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="34" font-weight="700" fill="#1c2428" >以黑箱推进为耻，以主动汇报为荣。</text><text x="162" y="1125" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="400" fill="#626b6e" >让人知道进展与取舍</text><rect x="65" y="1210" width="948" height="91" rx="8" fill="#161c20"/><text x="100" y="1268" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="29" font-weight="600" fill="#f4f0e6" >可安装 Skill</text><text x="361" y="1268" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="29" font-weight="600" fill="#f4f0e6" >可合并 AGENTS.md</text><text x="739" y="1268" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="29" font-weight="600" fill="#f4f0e6" >附额度交接工具</text><text x="66" y="1352" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="27" font-weight="500" fill="#1c2428" >github.com/Cyh29hao/new-eight-honors-skill</text><text x="66" y="1397" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="400" fill="#626b6e" >作者的工作偏好 · 支持自行调整 · MIT 开源</text></svg>